services:
  - type: web
    name: zoom-fastapi-backend
    env: python
    buildCommand: pip install -r requirements.txt greenlet aiosqlite
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./meetings.db
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:3000
